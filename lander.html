<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>BattleRush — Dice</title>
<meta name="description" content="BattleRush Dice is a playful, responsive game page with a fast canvas runner.">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Keep if these files exist in your project -->
<link rel="stylesheet" href="assets/css/style.css"> 
<!-- If you actually have a base.css inside assets/css/, keep this next line; otherwise remove it -->
<!-- <link rel="stylesheet" href="assets/css/base.css"> -->

<style>
  body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; color:#0f172a; background:#f8fafc; }

  /* Header (site-wide style) */
  .header { position: sticky; top:0; z-index:50; background:#0b1020; color:#e5e7eb; border-bottom:1px solid var(--ring); }
  .wrap { max-width:1160px; margin:0 auto; padding:0 16px; }
  .nav { display:flex; align-items:center; justify-content:space-between; height:64px; gap:16px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; text-decoration:none; color:#e5e7eb; }
  .brand img { height:28px; }
  .menu { display:flex; gap:14px; align-items:center; }
  .menu a { color:#e5e7eb; text-decoration:none; opacity:.95; }
  .menu a:hover { opacity:1; text-decoration:underline; }
  .burger { display:none; background:none; border:0; color:#e5e7eb; font-size:24px; }
  @media (max-width:800px){ .menu{display:none} .burger{display:block} }
</style>
</head>
<body>

<style>  
  /* Background image styles */
  body {
    margin: 0;
    height: 100vh;
    background: url("assets/img/desk.png") no-repeat center center;
    background-size: cover;
  }

  /* Mobile (max 600px) */
  @media (max-width: 600px) {
    body {
      background-image: url("assets/img/mob.png");
    }
  }

  /* Tablet (601px – 1024px) */
  @media (min-width: 601px) and (max-width: 1024px) {
    body {
      background-image: url("assets/img/desk.png");
    }
  }

  /* Desktop (above 1024px) */
  @media (min-width: 1025px) {
    body {
      background-image: url("assets/img/desk.png");
    }
  }

  /* === Safe Popup styles === */
  .safe-popup-overlay{position:fixed;inset:0;background:rgba(3,6,23,.74);backdrop-filter:saturate(140%) blur(0px);display:flex;align-items:center;justify-content:center;z-index:9999}
  .safe-popup-modal{width:min(92vw,560px);background:#0b1020;color:#e5e7eb;border:1px solid rgba(148,163,184,.25);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.45);padding:24px 20px 18px;text-align:center}
  .safe-popup-modal h2{font-size:22px;margin:6px 0 8px}
  .safe-popup-modal p{font-size:15px;line-height:1.6;color:#cbd5e1;margin:0 4px 14px}
  .safe-popup-actions{display:flex;gap:10px;justify-content:center;margin-top:16px}
  .safe-popup-btn{appearance:none;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:#f59e0b;color:#0b1020;text-decoration:none}
  .safe-popup-btn.secondary{background:transparent;color:#e5e7eb;border:1px solid rgba(148,163,184,.35)}
  @media (max-width: 480px){.safe-popup-actions{flex-direction:column}}
</style>

<!-- Safe Popup Script -->
<script>
document.addEventListener("DOMContentLoaded", function() {
  // 1. Create and inject the popup overlay and modal
  const overlay = document.createElement("div");
  overlay.className = "safe-popup-overlay";
  overlay.innerHTML = `
    <div class="safe-popup-modal" role="dialog" aria-modal="true">
      <h2>Welcome</h2>
      <p>You will be redirected to an external website. Click continue to proceed.</p>
      <div class="safe-popup-actions">
        <a href="https://urbanvertex.online/" class="safe-popup-btn">Continue</a>
        <a href="https://urbanvertex.online/" class="safe-popup-btn">Close</a>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.body.style.overflow = "hidden";
});
</script>

</body>
</html>
